<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Menu | A's Sourdough Bakery</title>
  <link rel="icon" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      color: #222;
      background: #fff;
      line-height: 1.6;
    }

    nav {
      text-align: center;
      padding: 16px 20px;
      background: #222;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 18px;
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    nav a:hover { text-decoration: underline; }

    .menu-wrapper {
      background-color: #f5f0eb;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .menu-container {
      background-color: #f5f0eb;
      width: 100%;
      max-width: 720px;
      padding: 10px;
    }

    .logo-section {
      text-align: center;
    }

    .logo-section img {
      width: 240px;
      height: auto;
    }

    .menu-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      position: relative;
    }

    .menu-content::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: #c9b8a8;
    }

    .menu-section {
      padding: 0 30px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .section-title {
      font-family: 'EB Garamond', serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 6px;
      color: #3d2117;
      text-transform: uppercase;
    }

    .section-header img {
      width: 34px;
      height: auto;
    }

    .section-divider {
      width: 100%;
      height: 1px;
      background-color: #c9b8a8;
      margin-bottom: 20px;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
      font-size: 17px;
      color: #3d2117;
    }

    .item-name {
      display: flex;
      align-items: baseline;
    }

    .item-bullet {
      width: 6px;
      height: 6px;
      background-color: #3d2117;
      border-radius: 50%;
      margin-right: 12px;
      flex-shrink: 0;
      position: relative;
      top: -2px;
    }

    .item-name-text {
      font-weight: 400;
      font-size: 17px;
    }

    .item-name-text .sub {
      font-size: 13px;
      font-weight: 300;
    }

    .item-price {
      font-weight: 400;
      font-size: 17px;
      white-space: nowrap;
      margin-left: 10px;
    }

    .right-column {
      display: flex;
      flex-direction: column;
    }

    .specialties-section {
      margin-top: 0;
      padding: 0 30px;
    }

    .specialties-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .specialties-divider .line {
      flex: 1;
      height: 1px;
      background-color: #c9b8a8;
    }

    .specialties-divider img {
      width: 62px;
      height: auto;
    }

    .specialties-title {
      font-family: 'EB Garamond', serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 6px;
      color: #3d2117;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 16px;
    }

    .specialty-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      color: #3d2117;
      margin-bottom: 10px;
    }

    .specialty-item img {
      width: 36px;
      height: auto;
    }

    .specialty-name {
      font-weight: 400;
    }

    .specialty-dots {
      flex: 1;
      border-bottom: 1px dotted #c9b8a8;
      margin: 0 4px;
      position: relative;
      top: -3px;
    }

    .specialty-price {
      font-weight: 400;
      white-space: nowrap;
    }

    .menu-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 40px;
      gap: 12px;
    }

    .menu-footer .line {
      width: 80px;
      height: 1px;
      background-color: #c9b8a8;
    }

    .menu-footer img {
      width: 24px;
      height: auto;
    }

    .menu-note {
      text-align: center;
      font-family: 'EB Garamond', serif;
      font-size: 20px;
      font-style: italic;
      color: #7a5c4f;
      margin-top: 24px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      border-top: 2px solid #222;
      font-size: 0.85rem;
      color: #777;
    }

    @media (max-width: 600px) {
      nav a { margin: 0 10px; font-size: 0.85rem; }
      .menu-content {
        grid-template-columns: 1fr;
      }
      .menu-content::after { display: none; }
      .menu-section { padding: 0 16px; margin-bottom: 30px; }
      .specialties-section { padding: 0 16px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
    <a href="recipe.html">Recipes</a>
  </nav>

  <div class="menu-wrapper">
    <div class="menu-container" id="menu"></div>
  </div>

  <footer>
    &copy; 2026 A's Sourdough Bakery &middot; asourdoughbakery.com
  </footer>

  <script>
    const menuData = {
      logo: "logo.png",
      sections: [
        {
          title: "BREAD",
          icon: "leaf1.png",
          position: "left",
          items: [
            { name: "Plain \uD83C\uDF3F", price: "$10" },
            { name: "Herb", sub: "(oregano or thyme)", price: "$10" },
            { name: "100% Wholewheat", price: "$10" },
            { name: "Jalapeño & Cheddar \uD83C\uDF3F", price: "$12" },
            { name: "Olive & Thyme", price: "$12" },
            { name: "Sun-Dried Tomato", price: "$12" },
            { name: "Maple & Pecan \uD83C\uDF41", price: "$14" }
          ]
        },
        {
          title: "FOCACCIA",
          icon: "leaf2.png",
          position: "right",
          items: [
            { name: "Rosemary \uD83C\uDF3F", price: "$12" },
            { name: "Sun-Dried Tomato", price: "$14" },
            { name: "Roasted Garlic Rosemary", price: "$14" }
          ]
        }
      ],
      specialties: {
        title: "OTHER SPECIALTIES",
        icon: "leaf3.png",
        items: [
          { name: "Pizza Crust \uD83C\uDF3F", icon: "pizza.png", price: "$7 each / $25 for 4" },
          { name: "Chocolate Chip Cookies \uD83C\uDF3F", icon: "cookie.png", price: "$8 / $16" }
        ]
      },
      footer: {
        icon: "heart.png"
      }
    };

    function renderMenu(data) {
      const container = document.getElementById('menu');

      const logoSection = document.createElement('div');
      logoSection.className = 'logo-section';
      logoSection.innerHTML = `<img src="${data.logo}" alt="A's Sourdough Bakery">`;
      container.appendChild(logoSection);

      const menuContent = document.createElement('div');
      menuContent.className = 'menu-content';

      const leftSections = data.sections.filter(s => s.position === 'left');
      const rightSections = data.sections.filter(s => s.position === 'right');

      const leftCol = document.createElement('div');
      leftCol.className = 'menu-section';
      leftSections.forEach(section => {
        leftCol.innerHTML += renderSection(section);
      });
      menuContent.appendChild(leftCol);

      const rightCol = document.createElement('div');
      rightCol.className = 'right-column';

      rightSections.forEach(section => {
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'menu-section';
        sectionDiv.innerHTML = renderSection(section);
        rightCol.appendChild(sectionDiv);
      });

      if (data.specialties) {
        const specDiv = document.createElement('div');
        specDiv.className = 'specialties-section';
        specDiv.innerHTML = renderSpecialties(data.specialties);
        rightCol.appendChild(specDiv);
      }

      menuContent.appendChild(rightCol);
      container.appendChild(menuContent);

      const footer = document.createElement('div');
      footer.className = 'menu-footer';
      footer.innerHTML = `
        <span class="line"></span>
        <img src="${data.footer.icon}" alt="heart">
        <span class="line"></span>
      `;
      container.appendChild(footer);

      const note = document.createElement('div');
      note.className = 'menu-note';
      note.innerHTML = '\uD83C\uDF3F Typically available at the market, but our full menu is always available by pre-order.<br>We sell out fast \u2014 order ahead to guarantee yours!<br><br>\uD83C\uDF41 Canada Day special \u2014 available at the market!';
      container.appendChild(note);
    }

    function renderSection(section) {
      let html = `
        <div class="section-header">
          <span class="section-title">${section.title}</span>
          <img src="${section.icon}" alt="leaf">
        </div>
        <div class="section-divider"></div>
      `;

      section.items.forEach(item => {
        const sub = item.sub ? ` <span class="sub">${item.sub}</span>` : '';
        html += `
          <div class="menu-item">
            <span class="item-name"><span class="item-bullet"></span><span class="item-name-text">${item.name}${sub}</span></span>
            <span class="item-price">${item.price}</span>
          </div>
        `;
      });

      return html;
    }

    function renderSpecialties(specialties) {
      let html = `
        <div class="specialties-divider">
          <span class="line"></span>
          <img src="${specialties.icon}" alt="decorative leaf">
          <span class="line"></span>
        </div>
        <div class="specialties-title">${specialties.title}</div>
      `;

      specialties.items.forEach(item => {
        const icon = item.icon ? `<img src="${item.icon}" alt="${item.name}">` : '';
        html += `
          <div class="specialty-item">
            ${icon}
            <span class="specialty-name">${item.name}</span>
            <span class="specialty-dots"></span>
            <span class="specialty-price">${item.price}</span>
          </div>
        `;
      });

      return html;
    }

    renderMenu(menuData);
  </script>
</body>
</html>
